[preferred]
default=hyprland;gtk;
# Use GNOME's Nautilus chooser while retaining Hyprland's compositor portals.
org.freedesktop.impl.portal.FileChooser=gnome;gtk;
org.freedesktop.impl.portal.Secret=oo7-portal;gnome-keyring;
org.freedesktop.impl.portal.AppChooser=dotfiles;gtk;
org.freedesktop.impl.portal.Access=dotfiles;gtk;
org.freedesktop.impl.portal.Background=dotfiles;
org.freedesktop.impl.portal.Wallpaper=dotfiles;
org.freedesktop.impl.portal.Usb=dotfiles;
org.freedesktop.impl.portal.RemoteDesktop=dotfiles;
org.freedesktop.impl.portal.Clipboard=dotfiles;
