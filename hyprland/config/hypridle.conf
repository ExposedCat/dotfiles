# Active after a successful manual lock/unlock check (desktop.py enable-idle).
general {
    lock_cmd = systemd-run --user --collect --quiet --unit=dotfiles-hyprland-lock --property=PartOf=graphical-session.target /usr/bin/hyprlock --no-fade-in
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    inhibit_sleep = 3
}

# Respect media/application idle inhibitors. No automatic suspend on this PC.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
