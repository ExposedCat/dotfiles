# Limit the output picker to HDMI / DisplayPort 5; preserve PodMic capture.
# To undo: remove this file and restart wireplumber.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.pci-0000_03_00.1" } ]
    actions = { update-props = {
      api.alsa.use-ucm = false
      api.acp.disable-pro-audio = true
      device.profile-set = "omen-hdmi5-only.conf"
    } }
  }
  {
    matches = [ { device.name = "alsa_card.usb-R__DE_R__DE_PodMic_USB_973F4E9B-00" } ]
    actions = { update-props = {
      api.alsa.use-ucm = false
      api.acp.disable-pro-audio = true
      device.profile-set = "podmic-input-only.conf"
    } }
  }
]
