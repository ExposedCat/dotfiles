[Unit]
After=dbus.service

[Service]
# Unlock the login keyring with the password sealed by `manage seal`. oo7 reads
# this credential itself; without it the service starts with a locked keyring.
ImportCredential=oo7.keyring-encryption-password
# oo7 exits successfully when its session bus disconnects.
Restart=always
RestartSec=2s
# GOA can retain the previous Secret Service connection across an oo7 restart.
# Queue the restart since GOA is ordered after this unit's startup.
ExecStartPost=-/usr/bin/systemctl --user --no-block try-restart dotfiles-goa-daemon.service

[Install]
# Start at desktop login and stay up for the lifetime of the user manager.
WantedBy=
WantedBy=graphical-session.target
