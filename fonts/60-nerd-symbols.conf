<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Preserve normal text; use Nerd Fonts for missing icon glyphs. -->
  <alias binding="strong">
    <family>Adwaita Sans</family>
    <accept><family>Symbols Nerd Font</family></accept>
  </alias>
  <alias binding="strong">
    <family>Adwaita Mono</family>
    <accept><family>Symbols Nerd Font Mono</family></accept>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <accept><family>Symbols Nerd Font</family></accept>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <accept><family>Symbols Nerd Font</family></accept>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <accept><family>Symbols Nerd Font Mono</family></accept>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <accept><family>Symbols Nerd Font</family></accept>
  </alias>
</fontconfig>
